{% set name = "optodetools" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/optodetools-{{ version }}.tar.gz
  sha256: 9449a6846f049e7cdbf1e106033f9acd77557b80a037ce9d69a5ac645932716d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - numpy
    - python >={{ python_min }}
    - scipy

test:
  imports:
    - optodetools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/cgrdn/optodetools
  summary: A python library for simulating and correcting oxygen optode time response error
  license: MIT
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - cgrdn
